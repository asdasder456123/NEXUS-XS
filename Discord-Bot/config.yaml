platform:
  discord:
    enabled: true
  whatsapp:
    enabled: false

bot:
  admin_user_id: 123456789
  debug: false

response:
  min_delay_seconds: 5
  max_delay_seconds: 300
  random_trigger_probability: 0.05
  group_max_responses: 3
  group_rate_limit_window_seconds: 10

whisper:
  model: large-v3-turbo
  language: auto
  cpu_threads: 2
  max_concurrent_transcriptions: 3

web_search:
  enabled: true
  timeout_seconds: 30

embedding:
  model: intfloat/multilingual-e5-large

ai:
  timeout_seconds: 60
  max_retries: 3
  global_timeout_seconds: 180

  providers:
    - name: my_groq
      type: openai
      base_url: https://api.groq.com/openai/v1
      model: openai/gpt-oss-120b

    - name: my_openrouter
      type: openai
      base_url: https://openrouter.ai/api/v1
      model: anthropic/claude-3.5-sonnet

    - name: my_cerebras
      type: openai
      base_url: https://api.cerebras.ai/v1
      model: llama-3.3-70b

    - name: my_deepseek
      type: openai
      base_url: https://api.deepseek.com
      model: deepseek-chat

  primary: my_groq

  fallbacks:
    - my_openrouter
    - my_cerebras
    - my_deepseek

  rotation: failover
